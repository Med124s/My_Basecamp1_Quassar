<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>403 - Forbidden</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .error-page {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
    }

    .error-box {
      text-align: center;
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .error-box h1 {
      font-size: 64px;
      color: #e74c3c;
      margin-bottom: 10px;
    }

    .error-box p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .error-box a {
      text-decoration: none;
      padding: 10px 20px;
      background: #3498db;
      color: #fff;
      border-radius: 4px;
    }

    .error-box a:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-box">
      <h1>403</h1>
      <p>Access Forbidden or Page Not Found</p>
      <a href="/">Go Home</a>
    </div>
  </div>
</body>
</html>
